## OpenSSL build targets for Windows NT 3.x with the NT 3.1 SDK toolchain
## (its clang configuration files supply headers,
## libraries and linker settings).
##   perl Configure nt31-i386|nt31-mips|nt31-ppc|nt31-alpha <options>

my %targets = (
    "nt31-common" => {
        inherit_from     => [ 'BASE_unix' ],
        template         => 1,
        CFLAGS           => picker(default => "-w",
                                   debug   => "-O0",
                                   release => "-O2"),
        # 0x030A: Windows NT 3.10. OpenSSL then leaves out the code for
        # later systems.
        # OPENSSL_RAND_SEED_NT31: the entropy source rand_nt31.c, which
        # uses the Windows API layer of the toolchain (nt31_winapi).
        cppflags         => "-DWIN32_LEAN_AND_MEAN -D_WIN32_WINNT=0x030A -DOPENSSL_RAND_SEED_NT31",
        lib_cppflags     => "-DL_ENDIAN",
        AR               => "llvm-ar",
        ARFLAGS          => "rc",
        RANLIB           => "llvm-ranlib",
        ex_libs          => add("-lnt31_winapi -ladvapi32 -luser32 -lgdi32 -lws2_32"),
        bn_ops           => "BN_LLONG",
        thread_scheme    => "winthreads",
        dso_scheme       => "win32",
        perl_platform    => 'mingw',
    },
    "nt31-i386" => {
        inherit_from     => [ "nt31-common" ],
        CC               => "i686-pc-windows-msvc-clang",
    },
    "nt31-mips" => {
        inherit_from     => [ "nt31-common" ],
        CC               => "mipsel-pc-windows-msvc-clang",
    },
    "nt31-ppc" => {
        inherit_from     => [ "nt31-common" ],
        CC               => "powerpcle-windows-msvc-clang",
    },
    "nt31-alpha" => {
        inherit_from     => [ "nt31-common" ],
        CC               => "alpha-windows-msvc-clang",
    },
);
